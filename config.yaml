# The Settings page saves local overrides in config.local.yaml. API keys can also come from environment variables.
chunking:
  tokenizer: cl100k_base
  chunk_size: 500
  overlap: 100

embedding:
  base_url: ""
  model: ""
  api_key_env: EMBEDDING_API_KEY
  dimensions: null
  batch_size: 8
  query_instruction: ""

retrieval:
  default_strategy: structure_aware
  store: data/index

generation:
  base_url: ""
  model: ""
  api_key_env: GENERATION_API_KEY
  temperature: null
  max_tokens: null

evaluation:
  questions_path: eval/questions.jsonl
  output_path: eval/report.md
  min_questions: 20
